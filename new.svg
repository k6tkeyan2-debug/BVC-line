<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="200" height="200">  
  <style>  
    .bouncing-plane {  
      animation: bounceEffect 2.5s infinite;  
      transform-origin: center bottom;  
    }  
      
    @keyframes bounceEffect {  
      0%, 20%, 53%, 80%, 100% {  
        animation-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1.000);  
        transform: translateY(0);  
      }  
      40%, 43% {  
        animation-timing-function: cubic-bezier(0.755, 0.050, 0.855, 0.060);  
        transform: translateY(-25px);  
      }  
      70% {  
        animation-timing-function: cubic-bezier(0.755, 0.050, 0.855, 0.060);  
        transform: translateY(-12px);  
      }  
      90% {  
        transform: translateY(-4px);  
      }  
    }  
  </style>  
  
  <g class="bouncing-plane">  
    <!-- Airplane Path -->  
    <path d="M 90,59  
             C 100,59 102,61 102,65  
             C 102,69 100,71 90,71  
             L 65,71  
             L 45,103  
             L 38,103  
             L 55,71  
             L 35,71  
             L 22,90  
             L 18,90  
             L 25,71  
             L 20,71  
             L 20,59  
             L 25,59  
             L 18,40  
             L 22,40  
             L 35,59  
             L 55,59  
             L 38,27  
             L 45,27  
             L 65,59  
             Z"  
          fill="#ffffff"  
          stroke="#000000"  
          stroke-width="5"  
          stroke-linejoin="round"  
          stroke-linecap="round" />  
  </g>  
</svg>  
