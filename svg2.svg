<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 135 100" width="100%" height="100%" color="#1a1a1a">  
  <defs>  
    <style>  
      .truck-group {  
        animation: drive-bounce 0.4s infinite alternate ease-in-out;  
        transform-origin: bottom center;  
      }  
      .wind-line {  
        stroke: currentColor;  
        stroke-width: 4;  
        stroke-linecap: round;  
        opacity: 0;  
        animation: wind-blow 1.2s infinite linear;  
      }  
      .w1 { top: 35px; animation-delay: 0s; }  
      .w2 { top: 55px; animation-delay: 0.4s; }  
      .w3 { top: 75px; animation-delay: 0.8s; }  
        
      @keyframes drive-bounce {  
        0% { transform: translateY(0); }  
        100% { transform: translateY(-2px); }  
      }  
        
      @keyframes wind-blow {  
        0% { transform: translateX(10px); opacity: 0; }  
        15% { opacity: 0.6; }  
        70% { opacity: 0.6; }  
        100% { transform: translateX(-40px); opacity: 0; }  
      }  
    </style>  
  </defs>  
  
  <!-- Speed/Wind Lines -->  
  <g id="speed-lines">  
    <line class="wind-line w1" x1="0" y1="35" x2="-20" y2="35" />  
    <line class="wind-line w2" x1="-5" y1="55" x2="-15" y2="55" />  
    <line class="wind-line w3" x1="5" y1="75" x2="-25" y2="75" />  
  </g>  
  
  <!-- Main Delivery Truck -->  
  <g id="truck" class="truck-group" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">  
      
    <!-- Cargo Box -->  
    <path d="M 27 80   
             L 14 80   
             A 8 8 0 0 1 6 72   
             L 6 22   
             A 8 8 0 0 1 14 14   
             L 66 14   
             A 8 8 0 0 1 74 22   
             L 74 80" />  
               
    <!-- Line between wheels -->  
    <line x1="47" y1="80" x2="74" y2="80" />  
      
    <!-- Front Cabin -->  
    <path d="M 74 38   
             L 86 38   
             L 103 58   
             L 103 74   
             A 6 6 0 0 1 97 80" />  
               
    <!-- Wheels -->  
    <circle cx="34" cy="80" r="7" />  
    <circle cx="84" cy="80" r="7" />  
      
  </g>  
</svg>  
