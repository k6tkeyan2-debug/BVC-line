<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">  
  <defs>  
    <!-- Sky Gradient -->  
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">  
      <stop offset="0%" stop-color="#2196F3"/>  
      <stop offset="60%" stop-color="#64B5F6"/>  
      <stop offset="100%" stop-color="#BBDEFB"/>  
    </linearGradient>  
  
    <!-- Sun Glow Gradient -->  
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">  
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="1"/>  
      <stop offset="40%" stop-color="#FFF176" stop-opacity="0.8"/>  
      <stop offset="100%" stop-color="#FFF176" stop-opacity="0"/>  
    </radialGradient>  
  
    <!-- Reusable Cloud -->  
    <g id="cloud">  
      <circle cx="20" cy="20" r="20" />  
      <circle cx="50" cy="10" r="25" />  
      <circle cx="80" cy="20" r="20" />  
      <rect x="20" y="20" width="60" height="20" />  
    </g>  
  
    <!-- Reusable Tree -->  
    <g id="tree">  
      <!-- Trunk -->  
      <path d="M -6,0 L 6,0 L 4,-45 L -4,-45 Z" fill="#5D4037"/>  
      <!-- Leaves -->  
      <circle cx="0" cy="-50" r="25" fill="#2E7D32"/>  
      <circle cx="-16" cy="-38" r="22" fill="#388E3C"/>  
      <circle cx="16" cy="-38" r="22" fill="#1B5E20"/>  
      <circle cx="0" cy="-28" r="24" fill="#4CAF50"/>  
    </g>  
  
    <!-- Reusable Grass Patch -->  
    <g id="grass">  
      <path d="M 10,20 Q 5,5 0,0 Q 5,10 10,20" fill="#2E7D32"/>  
      <path d="M 10,20 Q 15,0 20,-5 Q 15,10 10,20" fill="#388E3C"/>  
      <path d="M 10,20 Q 10,0 12,-10 Q 12,10 10,20" fill="#1B5E20"/>  
    </g>  
  
    <!-- Reusable Bird -->  
    <g id="bird">  
      <path d="M 0,0 Q 6,-6 12,0 Q 18,-6 24,0 Q 12,-3 0,0 Z" fill="#2C3E50"/>  
    </g>  
  </defs>  
  
  <!-- Sky Background -->  
  <rect width="800" height="600" fill="url(#skyGrad)"/>  
  
  <!-- Sun -->  
  <circle cx="650" cy="150" r="120" fill="url(#sunGlow)"/>  
  <circle cx="650" cy="150" r="40" fill="#FFEE58"/>  
  
  <!-- Clouds -->  
  <use href="#cloud" transform="translate(80, 80) scale(1.2)" fill="#FFFFFF" opacity="0.85"/>  
  <use href="#cloud" transform="translate(420, 50) scale(0.9)" fill="#FFFFFF" opacity="0.75"/>  
  <use href="#cloud" transform="translate(680, 110) scale(1.4)" fill="#FFFFFF" opacity="0.9"/>  
  <use href="#cloud" transform="translate(-10, 160) scale(0.8)" fill="#FFFFFF" opacity="0.6"/>  
  <use href="#cloud" transform="translate(280, 140) scale(0.7)" fill="#FFFFFF" opacity="0.5"/>  
  
  <!-- Birds -->  
  <use href="#bird" transform="translate(200, 120) scale(0.8)"/>  
  <use href="#bird" transform="translate(240, 100) scale(0.6)"/>  
  <use href="#bird" transform="translate(170, 140) scale(0.5)"/>  
  
  <!-- Background Mountains -->  
  <path d="M -100,450 L 150,220 L 450,450 Z" fill="#90A4AE"/>  
  <path d="M 250,450 L 520,180 L 850,450 Z" fill="#78909C"/>  
  <path d="M 600,450 L 750,280 L 950,450 Z" fill="#607D8B"/>  
  
  <!-- Distant Hills -->  
  <path d="M 0,420 Q 200,370 450,420 T 800,400 L 800,600 L 0,600 Z" fill="#81C784"/>  
  
  <!-- Sunbeams -->  
  <polygon points="650,150 -50,600 150,600" fill="#FFFFFF" opacity="0.07"/>  
  <polygon points="650,150 250,600 450,600" fill="#FFFFFF" opacity="0.05"/>  
  <polygon points="650,150 550,600 850,600" fill="#FFFFFF" opacity="0.04"/>  
  
  <!-- Midground Hills -->  
  <path d="M -50,460 Q 250,400 500,480 T 850,450 L 850,600 L -50,600 Z" fill="#66BB6A"/>  
  
  <!-- The Winding Road -->  
  <!-- Road Base / Shadow Edge -->  
  <path d="M 400,380 C 400,450 200,500 100,600 L 500,600 C 600,500 440,450 440,380 Z" fill="#90A4AE"/>  
  <!-- Road Surface -->  
  <path d="M 403,380 C 403,450 205,500 105,600 L 495,600 C 595,500 437,450 437,380 Z" fill="#CFD8DC"/>  
  <!-- Center Dashed Line -->  
  <path d="M 420,380 C 420,450 400,500 300,600" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="12, 18"/>  
    
  <!-- Foreground Hills (Overlapping road edges slightly for depth) -->  
  <path d="M -50,530 Q 80,490 105,600 L -50,600 Z" fill="#4CAF50"/>  
  <path d="M 495,600 Q 650,500 850,550 L 850,600 Z" fill="#4CAF50"/>  
  
  <!-- Trees (Background & Midground) -->  
  <use href="#tree" transform="translate(380, 390) scale(0.3)"/>  
  <use href="#tree" transform="translate(460, 400) scale(0.35)"/>  
  <use href="#tree" transform="translate(550, 430) scale(0.6)"/>  
  <use href="#tree" transform="translate(180, 440) scale(0.5)"/>  
  <use href="#tree" transform="translate(250, 420) scale(0.4)"/>  
  <use href="#tree" transform="translate(700, 470) scale(0.8)"/>  
  
  <!-- Signpost -->  
  <g id="signpost" transform="translate(120, 480)">  
    <rect x="-4" y="-50" width="8" height="70" fill="#795548"/>  
    <!-- Right pointing sign -->  
    <polygon points="-15,-45 20,-45 30,-38 20,-31 -15,-31" fill="#FFC107"/>  
    <!-- Left pointing sign -->  
    <polygon points="15,-25 -20,-25 -30,-18 -20,-11 15,-11" fill="#8BC34A"/>  
    <!-- Bird on signpost -->  
    <circle cx="10" cy="-49" r="4" fill="#03A9F4"/>  
    <polygon points="14,-50 18,-49 14,-48" fill="#FF9800"/>  
    <polygon points="6,-49 2,-51 2,-47" fill="#03A9F4"/>  
  </g>  
  
  <!-- The Walking Boy -->  
  <g id="boy" transform="translate(80, 20)">  
    <!-- Shadow -->  
    <ellipse cx="275" cy="540" rx="35" ry="6" fill="#000000" opacity="0.15"/>  
  
    <!-- Left Arm (Back, swinging forward) -->  
    <path d="M 275,430 L 295,450 L 310,445" fill="none" stroke="#C62828" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>  
    <circle cx="310" cy="445" r="4.5" fill="#FFCDB2"/>  
  
    <!-- Left Leg (Back, swinging backward) -->  
    <path d="M 276,470 L 260,490 L 245,510" fill="none" stroke="#1565C0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>  
    <!-- Left Shoe -->  
    <path d="M 235,510 L 255,510 A 5,5 0 0,1 255,520 L 235,520 Z" fill="#424242"/>  
    <path d="M 235,517 L 255,517 A 3,3 0 0,1 255,520 L 235,520 Z" fill="#FFFFFF"/>  
  
    <!-- Walking Stick (Held in right hand) -->  
    <path d="M 262,409 L 245,545" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>  
  
    <!-- Torso / Red Shirt -->  
    <path d="M 272,425 L 286,425 C 290,440 292,450 288,475 L 268,475 C 268,450 268,440 272,425 Z" fill="#E53935"/>  
  
    <!-- Yellow Backpack -->  
    <rect x="248" y="423" width="22" height="34" rx="6" fill="#FFCA28"/>  
    <!-- Backpack Flap -->  
    <path d="M 248,435 L 270,435 L 270,426 A 6,6 0 0,0 248,426 Z" fill="#FFB300"/>  
    <!-- Backpack Strap -->  
    <path d="M 272,425 Q 275,435 268,445" fill="none" stroke="#333333" stroke-width="2.5"/>  
  
    <!-- Neck -->  
    <rect x="274" y="415" width="6" height="12" fill="#FFCDB2"/>  
  
    <!-- Head Base -->  
    <path d="M 271,402 L 295,402 L 295,412 A 12,12 0 0,1 271,412 Z" fill="#FFCDB2"/>  
      
    <!-- Face Details -->  
    <circle cx="288" cy="405" r="2" fill="#3E2723"/> <!-- Eye -->  
    <path d="M 291,412 Q 293,414 295,412" fill="none" stroke="#D84315" stroke-width="1.5" stroke-linecap="round"/> <!-- Smile -->  
    <circle cx="277" cy="407" r="3" fill="#E6AE8C"/> <!-- Ear -->  
  
    <!-- Blue Cap -->  
    <!-- Dome -->  
    <path d="M 272,402 A 12,12 0 0,1 294,402 Z" fill="#1E88E5"/>  
    <!-- Brim -->  
    <path d="M 290,402 L 305,402 A 2,2 0 0,1 305,406 L 285,406 Z" fill="#0D47A1"/>  
    <!-- Top Button -->  
    <circle cx="283" cy="389" r="2.5" fill="#D32F2F"/>  
    <!-- Hair tuft sticking out of cap -->  
    <path d="M 294,402 Q 297,398 296,394 Q 292,398 290,402 Z" fill="#3E2723"/>  
  
    <!-- Right Leg (Front, stepping forward) -->  
    <path d="M 282,470 L 295,500 L 290,530" fill="none" stroke="#1E88E5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>  
    <!-- Right Shoe -->  
    <path d="M 280,530 L 300,530 A 5,5 0 0,1 300,540 L 280,540 Z" fill="#424242"/>  
    <path d="M 280,537 L 300,537 A 3,3 0 0,1 300,540 L 280,540 Z" fill="#FFFFFF"/>  
  
    <!-- Right Arm (Front, swinging backward holding stick) -->  
    <path d="M 280,430 L 270,455 L 255,465" fill="none" stroke="#F44336" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>  
    <circle cx="255" cy="465" r="4.5" fill="#FFCDB2"/>  
  </g>  
  
  <!-- Foreground Trees (For depth and framing) -->  
  <use href="#tree" transform="translate(40, 560) scale(1.4)"/>  
  <use href="#tree" transform="translate(750, 580) scale(1.6)"/>  
  
  <!-- Foreground Grass and Details -->  
  <use href="#grass" transform="translate(30, 570) scale(2)"/>  
  <use href="#grass" transform="translate(100, 585) scale(1.5)"/>  
  <use href="#grass" transform="translate(650, 560) scale(2.2)"/>  
  <use href="#grass" transform="translate(720, 590) scale(1.8)"/>  
    
  <!-- A few wildflowers -->  
  <circle cx="660" cy="550" r="3" fill="#FFEB3B"/>  
  <circle cx="670" cy="545" r="4" fill="#FFEB3B"/>  
  <circle cx="665" cy="555" r="3" fill="#FFEB3B"/>  
  <circle cx="80" cy="580" r="3" fill="#E1BEE7"/>  
  <circle cx="90" cy="575" r="4" fill="#E1BEE7"/>  
  
</svg>  
